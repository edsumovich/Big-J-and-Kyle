name: Update odds

on:
  schedule:
    # Times are UTC. These land roughly at 7am, 1pm, and 7:30pm US Eastern.
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest odds
        run: node scripts/fetch-odds.js
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}

      - name: Commit updated odds
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add data/games.json data/last-updated.json data/player-props.json
          git diff --staged --quiet || git commit -m "Update odds ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
