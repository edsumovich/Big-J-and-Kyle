/* ============================================================
   SUPABASE — your keys live in config.js, not here, on purpose.
   Every time this index.html file gets regenerated, it goes back
   to placeholder values (nothing in this chat stores your real
   keys). Keep config.js separate and it'll never get overwritten.
   Fill it in once — see config.js.
   The anon/publishable key is safe to expose client-side; Row
   Level Security is what actually protects the data (see the SQL
   setup script). Until config.js has real values, the app runs
   in browse-only demo mode — nobody can sign in, and nothing
   tries to hit a database that doesn't exist yet.
   ============================================================ */
const SUPABASE_URL = window.SUPABASE_URL || "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "YOUR_SUPABASE_ANON_KEY";
const SUPABASE_CONFIGURED = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;

      auth: { detectSessionInUrl: false, persistSession: true, autoRefreshToken: true },

  : null;

// Resolves an author for a pick/tail/fade: checks the demo USERS roster
// first (for the seeded mock content), then real fetched profiles, then
// falls back to a generic placeholder so nothing ever crashes on a

function getUser(id) {
  return USERS.find((u) => u.id === id) || PROFILES[id] || { id, name: "Someone", color: COLORS.muted };
}

// Hot/cold streak badges: fire if a user is 70%+ over their last 10 settled
// picks, ice if they're under 35% over their last 10. Needs a full 10 to
// qualify either way, and recomputes from scratch every time (so a badge
// disappears the moment the user's recent form drops out of range).
// Single source of truth for a user's hot/cold/heating status, shared by
// the avatar badges and the "Who's Hot?" tab so the criteria always match
// exactly. Sorts most-recent-first (smallest daysAgo) before evaluating.
function classifyHotStatus(rows) {
  const sorted = rows.slice().sort((a, b) => a.daysAgo - b.daysAgo);
  function pctOfFirst(n) {
    if (sorted.length < n) return null;
    return aggregate(sorted.slice(0, n)).winPct;
  }
  const pct10 = pctOfFirst(10);
  if (pct10 !== null && pct10 >= 70) return "fire";
  if (pct10 !== null && pct10 < 35) return "ice";
  const heating =
    [5, 6].some((n) => { const p = pctOfFirst(n); return p !== null && p >= 80; }) ||
    [7, 8, 9].some((n) => { const p = pctOfFirst(n); return p !== null && p >= 70; });
  return heating ? "heating" : null;
}

function computeBadges(rows) {
  const byUser = {};
  rows.forEach((r) => {
    if (!byUser[r.user]) byUser[r.user] = [];
    byUser[r.user].push(r);
  });
  const badges = {};
  Object.keys(byUser).forEach((userId) => {
    const status = classifyHotStatus(byUser[userId]);
    if (status === "fire" || status === "ice") badges[userId] = status;
  });
  return badges;
}

// the odds-loading effect below. Without this, logging out mid-session
// (without a full page reload) would leave GAMES pointing at whatever live
// data was last fetched, leaking real odds into what's supposed to be a
// fully static Demo Mode preview.
const MOCK_GAMES = GAMES;


function signed(n) {
  if (n === null || n === undefined || isNaN(n)) return "\u2014";
  return n > 0 ? "+" + n : String(n);
}

function sideOptions(game, market) {
  if (market === "Spread") {
    const hasLine = game.spread.line != null;
    const awayLine = hasLine ? (game.spread.favorite === "away" ? -game.spread.line : game.spread.line) : null;
    const homeLine = hasLine ? (game.spread.favorite === "home" ? -game.spread.line : game.spread.line) : null;
    return [
      { label: game.away + " " + signed(awayLine), odds: game.spread.odds, disabled: !hasLine || game.spread.odds == null },
      { label: game.home + " " + signed(homeLine), odds: game.spread.odds, disabled: !hasLine || game.spread.odds == null },
    ];
  }
  if (market === "Moneyline") {
    const opts = [
      { label: game.away + " ML", odds: game.moneyline.away, disabled: game.moneyline.away == null },
      { label: game.home + " ML", odds: game.moneyline.home, disabled: game.moneyline.home == null },
    ];
    if (game.moneyline.draw != null) {
      opts.splice(1, 0, { label: "Draw", odds: game.moneyline.draw, disabled: false });
    }
    return opts;
  }
  const hasTotalLine = game.total.line != null;
  return [
    { label: "Over " + (hasTotalLine ? game.total.line : "\u2014"), odds: game.total.overOdds, disabled: !hasTotalLine || game.total.overOdds == null },
    { label: "Under " + (hasTotalLine ? game.total.line : "\u2014"), odds: game.total.underOdds, disabled: !hasTotalLine || game.total.underOdds == null },
  ];
}

// Used by Fade. Historically accurate for Spread (our schema shares one
// odds value across both sides, and the opposite line is fully determined
// by the original pick's own number — so this stays correct even if the
// live line has since moved). Total keeps the original line but can't
// recover the flipped side's exact original odds (we only ever store the
// side that was actually picked), so those odds fall back to whatever's
// live now. Moneyline has no algebraic relationship between sides at all,
// so it's live-odds best effort too.
function oppositeSide(game, pick) {
  if (pick.market === "Total") {
    const isOver = pick.pick.slice(0, 4) === "Over";
    const lineStr = pick.pick.replace(/^(Over|Under)\s*/, "");
    return {
      label: (isOver ? "Under " : "Over ") + lineStr,
      odds: isOver ? game.total.underOdds : game.total.overOdds,
    };
  }
  if (pick.market === "Moneyline") {
    const isAway = pick.pick.indexOf(game.away) === 0;
    const otherTeam = isAway ? game.home : game.away;
    return { label: otherTeam + " ML", odds: isAway ? game.moneyline.home : game.moneyline.away };
  }
  // Spread
  const match = pick.pick.match(/^(.*)\s([+-]\d+(?:\.\d+)?)$/);
  if (match) {
    const originalTeam = match[1];
    const originalLine = parseFloat(match[2]);
    const otherTeam = originalTeam === game.away ? game.home : game.away;
    return { label: otherTeam + " " + signed(-originalLine), odds: pick.odds };
  }
  const opts = sideOptions(game, pick.market);
  return opts.find((o) => o.label !== pick.pick) || opts[0];
}

function lineSummary(game) {
  const favTeam = game.spread.favorite === "home" ? game.home : game.away;
  const spreadText = game.spread.line != null ? favTeam + " -" + game.spread.line : "Spread \u2014";
  const totalText = game.total.line != null ? "O/U " + game.total.line : "O/U \u2014";
  return spreadText + " \u00b7 " + totalText;
}

// Seeded demo picks so the board never looks empty. Computed against the
// CURRENT GAMES list (mock or live-odds) rather than hardcoded game ids,
// since live odds replace GAMES with real API ids that won't match fixed
// strings like "nfl1".
function computeSeedFeed() {
  const nfl = GAMES.filter((g) => g.sport === "NFL");
  const ncaafb = GAMES.filter((g) => g.sport === "NCAAFB");
  const rows = [];
  let n = 0;

  function add(game, market, sideIndex, user, stake, note) {
    if (!game) return;
    const opts = sideOptions(game, market);
    const side = opts[sideIndex] || opts[0];
    if (!side) return;
    rows.push({ id: "seed" + n++, user, game: game.id, market, pick: side.label, odds: side.odds, stake, note: note || "" });
  }

  const nfl1 = nfl[0], nfl2 = nfl[1];
  const fb1 = ncaafb[0], fb2 = ncaafb[1];

  add(nfl1, "Spread", 1, "reyna", 2, "Backing the home side here, not loving the road trip on a short week.");
  add(nfl1, "Total", 0, "theo", 1, "Both offenses look live in the opener, feels like it clears easy.");
  add(fb1, "Moneyline", 1, "casey", 1, "Free square in a laugher.");
  add(fb1, "Spread", 0, "theo", 1.5, "Backdoor cover potential once it's out of hand.");
  add(nfl2, "Spread", 1, "sam", 1, "Home dog, always a live watch.");
  add(nfl2, "Spread", 0, "nate", 2, "Not paying that many points on the road this early.");
  add(fb2, "Spread", 0, "devon", 3, "Not fading this one on the road.");
  add(fb2, "Spread", 1, "alicia", 2, "Backing the dog, feels like the number's too high.");

  return rows;
}

// Demo-only analytics so logged-out visitors can see what Analytics looks
// like before signing up. Built from the mock schedule's real teams/
// conferences so it looks legitimate, but it's entirely synthetic — real,
// logged-in users only ever see their actual graded picks (see dbGraded).
function computeDemoAnalytics() {
  const pool = GAMES;
  if (!pool.length) return [];
  const markets = ["Spread", "Moneyline", "Total"];
  const results = ["win", "win", "loss", "loss", "push"];
  const sources = ["own", "own", "own", "tail", "fade"];
  let rows = [];
  let id = 0;
  USERS.forEach((u) => {
    const n = 14 + (u.id.length % 5) * 3;
    for (let i = 0; i < n; i++) {
      const game = pool[(i * 3 + u.id.length) % pool.length];
      const market = markets[(i + 1) % markets.length];
      const result = results[(i * 7 + u.id.length * 3) % results.length];
      const source = sources[(i * 11 + u.id.length * 5) % sources.length];
      const stake = [1, 1, 1.5, 2, 2, 3][(i * 5 + u.id.length) % 6];
      const daysAgo = (i * 17 + u.id.length * 11) % 90;
      const pickedTeam = market === "Total" ? null : ((i + u.id.length) % 2 === 0 ? game.away : game.home);
      const overUnder = market === "Total" ? ((i + u.id.length) % 2 === 0 ? "Over" : "Under") : null;
      const created = new Date(Date.now() - daysAgo * 86400000);
      rows.push({
        id: "demo-hist" + id++, user: u.id, source,
        sport: game.sport, conf: game.conf, market, result, stake,
        teamA: game.away, teamB: game.home, pickedTeam, overUnder, daysAgo,
        dateLabel: created.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
      });
    }
  });

  // Guarantee a clear hot streak (fire badge) and cold streak (ice badge) in
  // the demo data so both are visible in Demo Mode without depending on the
  // pseudo-random generation above happening to produce one. Clears out any
  // of these two users' rows from the last 10 days first so the injected
  // results are unambiguously their "last 10 settled picks."
  const hotUser = "sam";
  const coldUser = "nate";
  rows = rows.filter((r) => !((r.user === hotUser || r.user === coldUser) && r.daysAgo < 10));

  function injectStreak(userId, wins) {
    for (let i = 0; i < 10; i++) {
      const game = pool[i % pool.length];
      rows.push({
        id: "demo-streak-" + userId + "-" + i, user: userId, source: "own",
        sport: game.sport, conf: game.conf, market: "Spread", result: i < wins ? "win" : "loss", stake: 1.5,
        teamA: game.away, teamB: game.home,
        pickedTeam: i % 2 === 0 ? game.away : game.home, overUnder: null,
        daysAgo: i,
        dateLabel: new Date(Date.now() - i * 86400000).toLocaleDateString("en-US", { month: "short", day: "numeric" }),
      });
    }
  }
  injectStreak(hotUser, 8); // 8 of last 10 = 80% -> fire badge
  injectStreak(coldUser, 2); // 2 of last 10 = 20% -> ice badge

  // A third guaranteed example: hot over her last 5 (4-1, 80%) but her
  // overall last 10 settles back to 50%, so she qualifies for "Heating Up"
  // without also tripping the fire badge/On Fire criteria.
  const heatingUser = "priya";
  rows = rows.filter((r) => !(r.user === heatingUser && r.daysAgo < 10));
  const heatingResults = ["win", "win", "win", "win", "loss", "loss", "loss", "loss", "win", "loss"];
  for (let i = 0; i < 10; i++) {
    const game = pool[(i + 1) % pool.length];
    rows.push({
      id: "demo-heat-" + i, user: heatingUser, source: "own",
      sport: game.sport, conf: game.conf, market: "Spread", result: heatingResults[i], stake: 1.5,
      teamA: game.away, teamB: game.home,
      pickedTeam: i % 2 === 0 ? game.away : game.home, overUnder: null,
      daysAgo: i,
      dateLabel: new Date(Date.now() - i * 86400000).toLocaleDateString("en-US", { month: "short", day: "numeric" }),
    });
  }

  return rows;
}

// A pick becomes manually-gradeable once its game has been over for a
// while. We only reliably know kickoff time (gameStartsAt, captured at
// pick-time), not the actual final whistle, so this assumes a generous
// ~4 hour game length on top of the requested "completed for over a day"
// window — i.e. gradeable once it's been more than ~28 hours since kickoff.
// Picks with no stored kickoff time (very old ones, or demo data) can't be
// confidently checked, so they're left ineligible rather than guessed at.
const GAME_DURATION_BUFFER_MS = 4 * 60 * 60 * 1000;
const ONE_DAY_MS = 24 * 60 * 60 * 1000;
function canManuallyGrade(pick) {
  if (pick.result) return false;
  if (!pick.gameStartsAt) return false;
  const startsAt = new Date(pick.gameStartsAt).getTime();
  if (isNaN(startsAt)) return false;
  return Date.now() - startsAt > GAME_DURATION_BUFFER_MS + ONE_DAY_MS;
}

function payoutUnits(stake, result) {
  if (result === "win") return stake * 0.91;
  if (result === "loss") return -stake;
  return 0;
}

function aggregate(rows) {
  const wins = rows.filter((r) => r.result === "win").length;
  const losses = rows.filter((r) => r.result === "loss").length;
  const pushes = rows.filter((r) => r.result === "push").length;
  const decided = wins + losses;
  const winPct = decided ? Math.round((wins / decided) * 100) : 0;
  const units = rows.reduce((s, r) => s + payoutUnits(r.stake, r.result), 0);
  const avgClv = rows.length ? rows.reduce((s, r) => s + r.clv, 0) / rows.length : 0;
  return {
    wins, losses, pushes, winPct,
    units: Math.round(units * 10) / 10,
    avgClv: Math.round(avgClv * 10) / 10,
    n: rows.length,
  };
}

function groupBy(rows, key) {
  const groups = {};
  rows.forEach((r) => {
    const k = r[key];
    if (!groups[k]) groups[k] = [];
    groups[k].push(r);
  });
  return groups;
}

function teamStats(rows) {
  const teams = Array.from(new Set(rows.flatMap((r) => [r.teamA, r.teamB]))).sort();
  return teams.map((team) => {
    const involved = rows.filter((r) => r.teamA === team || r.teamB === team);
    const forRows = involved.filter((r) => r.pickedTeam === team);
    const againstRows = involved.filter((r) => r.pickedTeam && r.pickedTeam !== team);
    const overRows = involved.filter((r) => r.overUnder === "Over");
    const underRows = involved.filter((r) => r.overUnder === "Under");
    return {
      team,
      sport: involved.length ? involved[0].sport : null,
      for: aggregate(forRows),
      against: aggregate(againstRows),
      overs: aggregate(overRows),
      unders: aggregate(underRows),
      combined: aggregate(involved),
    };
  });
}

function pct(agg) {
  return (agg.wins + agg.losses) > 0 ? agg.winPct + "%" : "\u2014";
}

function formatUpdatedAt(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  const time = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return "Updated " + time;
  const date = d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  return "Updated " + date + " \u00b7 " + time;
}

  const forceRerender = () => bump((n) => n + 1);

      .then((data) => {

      })
      .catch(() => {});
  }, [session && session.user ? session.user.id : null]);

  // --- auth: handle a magic-link redirect, restore session, keep it in sync ---
  useEffect(() => {
    if (!sb) { setAuthChecked(true); return; }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const errorDesc = params.get("error_description") || params.get("error");
      let codeWasProcessed = false;

      // Some Supabase projects (older ones especially) still use the
      // "implicit" auth flow, which puts tokens in the URL hash instead of
      // a ?code= query param. Handle both so this works either way.
      const hash = window.location.hash && window.location.hash.length > 1 ? window.location.hash.slice(1) : "";
      const hashParams = new URLSearchParams(hash);
      const hashAccessToken = hashParams.get("access_token");
      const hashRefreshToken = hashParams.get("refresh_token");
      const hashError = hashParams.get("error_description") || hashParams.get("error");

      if (errorDesc) {
        setLoginError(decodeURIComponent(errorDesc.replace(/\+/g, " ")));
        window.history.replaceState({}, "", window.location.pathname);
      } else if (hashError) {
        setLoginError(decodeURIComponent(hashError.replace(/\+/g, " ")));
        window.history.replaceState({}, "", window.location.pathname);
      } else if (code) {
        codeWasProcessed = true;
        const { error } = await sb.auth.exchangeCodeForSession(window.location.href);
        window.history.replaceState({}, "", window.location.pathname);
        if (error) {
          setLoginError(
            "Sign-in link failed: \u201c" + error.message + "\u201d \u2014 it may have expired, already been used, or been opened in a different browser than the one you requested it from."
          );
        }
      } else if (hashAccessToken && hashRefreshToken) {
        codeWasProcessed = true;
        const { error } = await sb.auth.setSession({ access_token: hashAccessToken, refresh_token: hashRefreshToken });
        window.history.replaceState({}, "", window.location.pathname);
        if (error) {
          setLoginError("Sign-in link failed: \u201c" + error.message + "\u201d");
        }
      }

      const { data } = await sb.auth.getSession();
      if (codeWasProcessed && !data.session) {
        setLoginError((prev) => prev || "The sign-in link redirected back here, but no session was created. Double-check your Supabase Redirect URLs match this exact address.");
      }
      applySession(data.session);
      setAuthChecked(true);
    }

    init();
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => applySession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  function applySession(sess) {
    setSession(sess);
    if (sess) {
      ME = { id: sess.user.id, name: sess.user.email.split("@")[0], color: COLORS.gold, avatarUrl: null };

        if (data) {
          ME = { id: data.id, name: data.name, color: data.color, avatarUrl: data.avatar_url || null };
          forceRerender();

      });
      setAuthOpen(false);
      setAuthStatus("idle");
      setLoginError("");
    } else {
      ME = USERS[0];
    }
    forceRerender();
  }

  function enterDemoMode() {

    sb.from("profiles").select("*").then(({ data }) => {
      if (data) {
        const map = {};
        data.forEach((p) => { map[p.id] = { id: p.id, name: p.name, color: p.color, avatarUrl: p.avatar_url || null }; });
        PROFILES = map;
        forceRerender();
      }
    });
    sb.from("picks").select("*").then(({ data }) => setDbFeed(data ? data.map(rowToPickShape) : []));
    sb.from("radar_picks").select("*").then(({ data }) => setDbRadar(data ? data.map(rowToPickShape) : []));
    sb.from("tails_fades").select("*").then(({ data }) => setDbTailsFades(data ? data.map(rowToTailFadeShape) : []));

    Promise.all([
      sb.from("picks").select("*").not("result", "is", null),
      sb.from("tails_fades").select("*").not("result", "is", null),
    ]).then(([pickRes, tfRes]) => {
      const gradedPicks = (pickRes.data || []).map((r) => gradedRowToAnalytics(r, "own"));
      const gradedTf = (tfRes.data || []).map((r) => gradedRowToAnalytics(r, r.type));
      const merged = [...gradedPicks, ...gradedTf];
      setDbGraded(merged);
    });
  }

  useEffect(() => { refreshBoard(); }, [session && session.user ? session.user.id : null]);

  // Demo/seed picks always show so logged-out browsing feels populated;
  // real rows from Supabase only ever load in once you're signed in.
  // Recomputed whenever GAMES changes (oddsStatus flipping to "live" swaps
  // GAMES to the real schedule with different game ids).
  const feed = useMemo(
    () => (session ? dbFeed : [...computeSeedFeed(), ...demoFeed]),
    [dbFeed, demoFeed, session, oddsStatus]
  );
  const radar = session ? dbRadar : demoRadar;
  const tailsFades = session ? dbTailsFades : demoTailsFades;
  const analyticsRows = useMemo(
    () => (session ? dbGraded : computeDemoAnalytics()),
    [session, dbGraded, oddsStatus]
  );
  const analyticsRoster = useMemo(
    () => (session ? Array.from(new Set(dbFeed.map((p) => p.user))) : USERS.map((u) => u.id)),
    [session, dbFeed]
  );
  BADGES = computeBadges(analyticsRows);

  function reportWriteError(label, error) {
    console.error(label + " failed:", error);
    window.alert("That didn't save (" + label + "): " + error.message);
  }

  async function addPick(gameId, pick) {
    const game = GAMES.find((g) => g.id === gameId);
    const gameLabel = game ? game.away + " @ " + game.home : null;
    const gameStartsAt = game ? game.startsAt : null;
    const gameSport = game ? game.sport : null;
    const gameConf = game ? game.conf : null;
    if (session && sb) {
      const uid = session.user.id;
      const { error } = await sb.from("picks").upsert(
        {
          user_id: uid, game_id: gameId, market: pick.market, pick: pick.pick, odds: pick.odds, stake: pick.stake, note: pick.note || "",
          game_label: gameLabel, game_starts_at: gameStartsAt, sport: gameSport, conf: gameConf,
        },
        { onConflict: "user_id,game_id,market" }
      );
      if (error) { reportWriteError("lock in pick", error); return; }
      await sb.from("radar_picks").delete().match({ user_id: uid, game_id: gameId, market: pick.market, pick: pick.pick });
      await sb.from("tails_fades").delete().match({ user_id: uid, game_id: gameId, market: pick.market, pick: pick.pick });
      refreshBoard();
      return;
    }
    // Demo mode: local-only sandbox, never touches Supabase, never asks you to log in.
    setDemoFeed((prev) => [
      ...prev.filter((p) => !(p.user === ME.id && p.game === gameId && p.market === pick.market)),
      { id: "demo-p" + Date.now(), user: ME.id, game: gameId, gameLabel, gameStartsAt, sport: gameSport, conf: gameConf, ...pick },
    ]);
    setDemoRadar((prev) => prev.filter((r) => !(r.user === ME.id && r.game === gameId && r.market === pick.market && r.pick === pick.pick)));
    setDemoTailsFades((prev) => prev.filter((t) => !(t.game === gameId && t.market === pick.market && t.pick === pick.pick)));
  }

  async function addRadar(gameId, pick) {
    const game = GAMES.find((g) => g.id === gameId);
    const gameLabel = game ? game.away + " @ " + game.home : null;
    const gameStartsAt = game ? game.startsAt : null;
    if (session && sb) {
      const { error } = await sb.from("radar_picks").upsert(
        {
          user_id: session.user.id, game_id: gameId, market: pick.market, pick: pick.pick, odds: pick.odds, stake: pick.stake, note: pick.note || "",
          game_label: gameLabel, game_starts_at: gameStartsAt,
        },
        { onConflict: "user_id,game_id,market" }
      );
      if (error) { reportWriteError("add to radar", error); return; }
      refreshBoard();
      return;
    }
    setDemoRadar((prev) => [
      ...prev.filter((r) => !(r.user === ME.id && r.game === gameId && r.market === pick.market)),
      { id: "demo-r" + Date.now(), user: ME.id, game: gameId, gameLabel, gameStartsAt, ...pick },
    ]);
  }

  async function removeRadar(gameId, market, pick) {
    if (session && sb) {
      const { error } = await sb.from("radar_picks").delete().match({ user_id: session.user.id, game_id: gameId, market, pick });
      if (error) { reportWriteError("remove from radar", error); return; }
      refreshBoard();
      return;
    }
    setDemoRadar((prev) => prev.filter((r) => !(r.user === ME.id && r.game === gameId && r.market === market && r.pick === pick)));
  }

  function toggleSection(sport) {
    setExpanded((prev) => ({ ...prev, [sport]: !prev[sport] }));
  }

  function openOverlay(pick, game) { setOverlay({ pick, game }); }
  function closeOverlay() { setOverlay(null); }

  async function addToSheet(stake) {
    if (!overlay) return;
    const { pick, game } = overlay;
    await addPick(game.id, { market: pick.market, pick: pick.pick, odds: pick.odds, stake: stake != null ? stake : pick.stake, note: "" });
    closeOverlay();
  }

  async function addTailFade(type) {
    if (!overlay) return;
    const { pick, game } = overlay;
    const side = type === "tail" ? { label: pick.pick, odds: pick.odds } : oppositeSide(game, pick);
    const gameLabel = game.away + " @ " + game.home;
    if (session && sb) {
      const { error } = await sb.from("tails_fades").upsert(
        {
          user_id: session.user.id, source_user_id: pick.user, game_id: game.id,
          market: pick.market, pick: side.label, odds: side.odds, stake: pick.stake, type,
          game_label: gameLabel, game_starts_at: game.startsAt || null, sport: game.sport || null, conf: game.conf || null,
        },
        { onConflict: "user_id,game_id" }
      );
      if (error) { reportWriteError(type === "tail" ? "tail" : "fade", error); return; }
      refreshBoard();
      closeOverlay();
      return;
    }
    setDemoTailsFades((prev) => [
      ...prev.filter((t) => t.game !== game.id),
      { id: "demo-tf" + Date.now(), type, sourceUser: pick.user, game: game.id, market: pick.market, pick: side.label, odds: side.odds, stake: pick.stake, gameLabel, gameStartsAt: game.startsAt || null, sport: game.sport || null, conf: game.conf || null },
    ]);
    closeOverlay();
  }

  async function signInWithPassword(email, password) {
    if (!sb || !email || !password) return;
    setAuthStatus("sending");
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      setAuthErrorDetail(error.message || "Unknown error");
      setAuthStatus("error");
    } else {
      setAuthErrorDetail("");
      setAuthStatus("idle");
    }
  }

  async function signUpWithPassword(email, password) {
    if (!sb || !email || !password) return;
    setAuthStatus("sending");
    const { data, error } = await sb.auth.signUp({
      email, password,
      options: { emailRedirectTo: window.location.origin + window.location.pathname },
    });
    if (error) {
      setAuthErrorDetail(error.message || "Unknown error");
      setAuthStatus("error");
      return;
    }
    if (data.session) {
      // Email confirmation is off for this project — signed in right away.
      setAuthErrorDetail("");
      setAuthStatus("idle");
    } else {
      // Email confirmation is on — needs to click a link before they can sign in.
      setAuthErrorDetail("");
      setAuthStatus("confirm");
    }
  }

  async function signOut() {
    if (!sb) return;
    await sb.auth.signOut();
  }

  function openAccount() {
    setDisplayName(ME.name || "");
    setNameStatus("idle");
    setAccountOpen(true);
  }

  async function saveDisplayName(name) {
    const trimmed = name.trim();
    if (!sb || !session || !trimmed) return;
    setNameStatus("saving");
    const { error } = await sb.from("profiles").update({ name: trimmed }).eq("id", session.user.id);
    if (error) {
      setNameStatus("error");
      return;
    }
    ME = { ...ME, name: trimmed };
    PROFILES = { ...PROFILES, [session.user.id]: { ...(PROFILES[session.user.id] || {}), id: session.user.id, name: trimmed, color: ME.color } };
    forceRerender();
    setNameStatus("saved");
  }

  async function editPickNote(pickId, note) {
    if (session && sb) {
      const { error } = await sb.from("picks").update({ note }).eq("id", pickId).eq("user_id", session.user.id);
      if (error) { reportWriteError("save comment", error); return; }
      refreshBoard();
      return;
    }
    setDemoFeed((prev) => prev.map((p) => (p.id === pickId ? { ...p, note } : p)));
  }

  // Lets a user grade (or re-grade) their own pick once its game has been
  // over for a while — see canManuallyGrade() for the exact eligibility
  // window. Marks result_source: "manual" so History can label it and only
  // manually-entered results stay editable later (auto-graded ones don't).
  async function markResultManually(table, pickId, result) {
    if (session && sb) {
      const { error } = await sb.from(table).update({ result, result_source: "manual" }).eq("id", pickId).eq("user_id", session.user.id);
      if (error) {
        console.error("Failed to save manual grade:", error);
        window.alert("Couldn't save that grade: " + error.message);
        return;
      }
      refreshBoard();
      return;
    }
    const setter = table === "tails_fades" ? setDemoTailsFades : setDemoFeed;
    setter((prev) => prev.map((p) => (p.id === pickId ? { ...p, result, resultSource: "manual" } : p)));
  }

  async function uploadAvatar(file) {
    if (!sb || !session || !file) return;
    if (!file.type || !file.type.startsWith("image/")) {
      setAvatarStatus("error");
      return;
    }
    setAvatarStatus("uploading");
    const ext = (file.name.split(".").pop() || "png").toLowerCase();
    const path = session.user.id + "/avatar." + ext;
    const { error: uploadError } = await sb.storage.from("avatars").upload(path, file, {
      upsert: true,
      contentType: file.type,
    });
    if (uploadError) {
      setAvatarStatus("error");
      return;
    }
    const { data: urlData } = sb.storage.from("avatars").getPublicUrl(path);
    const publicUrl = urlData.publicUrl + "?t=" + Date.now(); // cache-bust so the new image shows immediately
    const { error: updateError } = await sb.from("profiles").update({ avatar_url: publicUrl }).eq("id", session.user.id);
    if (updateError) {
      setAvatarStatus("error");
      return;
    }
    ME = { ...ME, avatarUrl: publicUrl };
    PROFILES = { ...PROFILES, [session.user.id]: { ...(PROFILES[session.user.id] || {}), id: session.user.id, avatarUrl: publicUrl } };
    forceRerender();
    setAvatarStatus("saved");
  }

  const showGate = authChecked && !session && !demoMode;

  if (!authChecked) {
    return <div style={{ background: COLORS.bg, minHeight: "100vh" }} />;
  }

  if (showGate) {
    return (
      <React.Fragment>
        <GateScreen onDemo={enterDemoMode} onLogin={() => setAuthOpen(true)} error={loginError} />
        {authOpen && (
          <AuthModal
            email={authEmail}
            setEmail={setAuthEmail}
            password={authPassword}
            setPassword={setAuthPassword}
            mode={authMode}
            setMode={setAuthMode}
            status={authStatus}
            errorDetail={authErrorDetail}
            configured={SUPABASE_CONFIGURED}
            onClose={() => { setAuthOpen(false); setAuthStatus("idle"); setAuthErrorDetail(""); }}
            onSubmit={() => (authMode === "signup" ? signUpWithPassword(authEmail, authPassword) : signInWithPassword(authEmail, authPassword))}
          />
        )}
      </React.Fragment>
    );
  }

  return (
    <div style={{ background: COLORS.bg, minHeight: "100vh", color: "#E7EAF0" }}>
      <TopNav
        tab={tab} setTab={setTab} sheetCount={tailsFades.length + radar.length}
        session={session} configured={SUPABASE_CONFIGURED}
        onSignIn={() => setAuthOpen(true)} onSignOut={signOut} onOpenAccount={openAccount}
      />
      <main style={{ maxWidth: 1040, margin: "0 auto", padding: "24px 20px 80px" }}>
        {!session && (
          <div style={{
            display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap",
            background: "rgba(217,164,65,0.12)", border: "1px solid rgba(217,164,65,0.4)", borderRadius: 10,
            padding: "12px 14px", marginBottom: 16, fontSize: 13, color: COLORS.paper, lineHeight: 1.5,
          }}>
            <span>
              <strong>You're in Demo Mode.</strong> Play around &mdash; lock in a pick, add one to your radar, check out other users' picks and comments, and browse Analytics. Nothing here is permanent until you log in.
            </span>
            <button
              onClick={() => setAuthOpen(true)}
              style={{ background: COLORS.gold, color: "#1A1305", border: "none", borderRadius: 8, padding: "7px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer", flexShrink: 0, whiteSpace: "nowrap" }}
            >
              Log In
            </button>
          </div>
        )}
        {loginError && (
          <div style={{
            display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10,
            background: "rgba(194,75,63,0.14)", border: "1px solid rgba(194,75,63,0.4)", borderRadius: 10,
            padding: "12px 14px", marginBottom: 16, fontSize: 13, color: COLORS.paper, lineHeight: 1.5,
          }}>
            <span>{loginError}</span>
            <button onClick={() => setLoginError("")} style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", flexShrink: 0 }}>
              <XIcon size={16} />
            </button>
          </div>
        )}
        {tab === "slate" && (
          <SlateTab feed={feed} radar={radar} tailsFades={tailsFades} addPick={addPick} addRadar={addRadar} removeRadar={removeRadar} onEditNote={editPickNote} expanded={expanded} toggleSection={toggleSection} onOpenOverlay={openOverlay} oddsUpdatedLabel={formatUpdatedAt(oddsUpdatedAt)} />
        )}
        {tab === "sheet" && <SheetTab feed={feed} tailsFades={tailsFades} radar={radar} dbGraded={analyticsRows} onGrade={markResultManually} />}
        {tab === "hot" && <WhosHotTab dbGraded={analyticsRows} dbRoster={analyticsRoster} />}
        {tab === "analytics" && <AnalyticsTab analyticsUser={analyticsUser} setAnalyticsUser={setAnalyticsUser} dbGraded={analyticsRows} dbRoster={analyticsRoster} />}
      </main>
      {overlay && (
        <PickOverlay
          pick={overlay.pick}
          game={overlay.game}
          onClose={closeOverlay}
          onAddToSheet={addToSheet}
          onTail={() => addTailFade("tail")}
          onFade={() => addTailFade("fade")}
        />
      )}
      {authOpen && (
        <AuthModal
          email={authEmail}
          setEmail={setAuthEmail}
          password={authPassword}
          setPassword={setAuthPassword}
          mode={authMode}
          setMode={setAuthMode}
          status={authStatus}
          errorDetail={authErrorDetail}
          configured={SUPABASE_CONFIGURED}
          onClose={() => { setAuthOpen(false); setAuthStatus("idle"); setAuthErrorDetail(""); }}
          onSubmit={() => (authMode === "signup" ? signUpWithPassword(authEmail, authPassword) : signInWithPassword(authEmail, authPassword))}
        />
      )}
      {accountOpen && (
        <AccountModal
          email={session ? session.user.email : ""}
          name={displayName}
          setName={setDisplayName}
          status={nameStatus}
          avatarStatus={avatarStatus}
          onClose={() => setAccountOpen(false)}
          onSave={() => saveDisplayName(displayName)}
          onUploadAvatar={uploadAvatar}
          onSignOut={signOut}
        />
      )}
    </div>
  );
}

function rowToPickShape(row) {
  return {
    id: row.id, user: row.user_id, game: row.game_id, market: row.market, pick: row.pick, odds: row.odds, stake: Number(row.stake), note: row.note || "",
    result: row.result || null, resultSource: row.result_source || null,
    gameLabel: row.game_label || null, gameStartsAt: row.game_starts_at || null,
  };
}

function rowToTailFadeShape(row) {
  return {
    id: row.id, type: row.type, sourceUser: row.source_user_id, game: row.game_id, market: row.market, pick: row.pick, odds: row.odds, stake: Number(row.stake),
    result: row.result || null, resultSource: row.result_source || null,
    gameLabel: row.game_label || null, gameStartsAt: row.game_starts_at || null,
  };
}

// Turns a graded (result set) row from `picks` or `tails_fades` into the
// shape Analytics computes from — looks up the game it was made on to pull
// sport/conference/teams, and parses the picked side out of the label.
function gradedRowToAnalytics(row, source) {
  const game = GAMES.find((g) => g.id === row.game_id);
  let sport = row.sport || (game ? game.sport : "Unknown");
  let conf = row.conf || (game ? game.conf : "Unknown");
  let teamA = game ? game.away : null;
  let teamB = game ? game.home : null;
  if (!game && row.game_label && row.game_label.includes(" @ ")) {
    const parts = row.game_label.split(" @ ");
    teamA = parts[0];
    teamB = parts[1];
  }
  let pickedTeam = null, overUnder = null;
  if (row.market === "Total") {
    overUnder = row.pick.indexOf("Over") === 0 ? "Over" : row.pick.indexOf("Under") === 0 ? "Under" : null;
  } else {
    pickedTeam = row.pick.replace(/\s+(?:[+-]\d+(\.\d+)?|ML)\s*$/, "").trim();
  }
  const created = row.created_at ? new Date(row.created_at) : new Date();
  const daysAgo = Math.max(0, Math.floor((Date.now() - created.getTime()) / 86400000));
  return {
    id: row.id, user: row.user_id, source: source || "own",
    sport, conf, market: row.market, result: row.result, resultSource: row.result_source || null, stake: Number(row.stake),
    teamA, teamB, pickedTeam, overUnder, daysAgo,
    dateLabel: created.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
  };
}

function Avatar({ user, size }) {
  const s = size || 28;
  const initials = user.name.slice(0, 2).toUpperCase();
  const badge = BADGES[user.id];
  const badgeSize = Math.max(13, Math.round(s * 0.42));

  const inner = user.avatarUrl ? (
    <img
      src={user.avatarUrl}
      alt={user.name}
      title={user.name}
      style={{ width: s, height: s, borderRadius: "50%", objectFit: "cover", display: "block", background: user.color }}
    />
  ) : (
    <div title={user.name} style={{
      width: s, height: s, borderRadius: "50%", background: user.color,
      display: "flex", alignItems: "center", justifyContent: "center",
      fontFamily: FONT_MONO, fontSize: s * 0.36, fontWeight: 600, color: "#14171E",
    }}>
      {initials}
    </div>
  );

  return (
    <div style={{ position: "relative", width: s, height: s, flexShrink: 0 }}>
      {inner}
      {badge && (
        <span
          title={badge === "fire" ? "70%+ over last 10 settled picks" : "Under 35% over last 10 settled picks"}
          style={{
            position: "absolute", bottom: -3, right: -3, width: badgeSize, height: badgeSize,
            borderRadius: "50%", background: COLORS.bg, border: "1.5px solid " + COLORS.surface,
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: badgeSize * 0.62, lineHeight: 1,
          }}
        >
          {badge === "fire" ? "\ud83d\udd25" : "\ud83e\uddca"}
        </span>
      )}
    </div>
  );
}

function SlateTab({ feed, radar, tailsFades, addPick, addRadar, removeRadar, onEditNote, expanded, toggleSection, onOpenOverlay, oddsUpdatedLabel }) {
  const [search, setSearch] = useState("");
  const term = search.trim().toLowerCase();
  const matches = (g) => !term || g.away.toLowerCase().includes(term) || g.home.toLowerCase().includes(term);
  // Once a real event's kickoff has passed, it drops off the Slate. Mock/
  // demo entries have no startsAt, so this never affects them.
  const notStarted = (x) => !x.startsAt || new Date(x.startsAt).getTime() > Date.now();

  const nflGames = GAMES.filter((g) => g.sport === "NFL" && matches(g) && notStarted(g));
  const ncaafbGames = GAMES.filter((g) => g.sport === "NCAAFB" && matches(g) && notStarted(g));
  const eplGames = GAMES.filter((g) => g.sport === "EPL" && matches(g) && notStarted(g));
  const serieaGames = GAMES.filter((g) => g.sport === "SERIEA" && matches(g) && notStarted(g));
  const bundGames = GAMES.filter((g) => g.sport === "BUNDESLIGA" && matches(g) && notStarted(g));
  const totalMatches = nflGames.length + ncaafbGames.length + eplGames.length + serieaGames.length + bundGames.length;

  return (
    <div>
      <SearchBox value={search} onChange={setSearch} placeholder="Search by team" />
      {term && totalMatches === 0 && (
        <div style={{ fontSize: 13, color: COLORS.muted, padding: "16px 4px" }}>No games match &ldquo;{search}&rdquo;.</div>

              {nflGames.map((g) => (
                <SafeRender key={g.id} label={g.away + " @ " + g.home}>
                  <GameTicket
                    game={g}
                    picks={feed.filter((p) => p.game === g.id)}
                    radarPicks={radar.filter((r) => r.game === g.id)}
                    tailFadePicks={tailsFades.filter((t) => t.game === g.id)}
                    onAddPick={(pick) => addPick(g.id, pick)}
                    onAddRadar={(pick) => addRadar(g.id, pick)}
                    onRemoveRadar={(market, pick) => removeRadar(g.id, market, pick)}

                    onOpenOverlay={onOpenOverlay}

            </div>

        </CollapsibleGroup>

        <CollapsibleGroup label="NCAAFB" count={ncaafbGames.length} open={expanded.NCAAFB} onToggle={() => toggleSection("NCAAFB")} updatedLabel={oddsUpdatedLabel}>
          {ncaafbGames.length === 0 ? (
            <div style={{ fontSize: 13, color: COLORS.muted, padding: "4px 4px 8px" }}>
              {term ? "No NCAAFB games match \u201c" + search + "\u201d." : "No NCAAFB games available right now."}
            </div>
          ) : (
            <div style={{ display: "grid", gap: 12 }}>
              {ncaafbGames.map((g) => (
                <SafeRender key={g.id} label={g.away + " @ " + g.home}>
                  <GameTicket
                    game={g}
                    picks={feed.filter((p) => p.game === g.id)}
                    radarPicks={radar.filter((r) => r.game === g.id)}

function GameTicket({ game, picks, radarPicks, tailFadePicks, onAddPick, onAddRadar, onRemoveRadar, onEditNote, onOpenOverlay }) {
  const [formOpen, setFormOpen] = useState(false);
  const [market, setMarket] = useState("Spread");
  const [side, setSide] = useState(null);
  const [stake, setStake] = useState(1);
  const [note, setNote] = useState("");
  const [editingNoteId, setEditingNoteId] = useState(null);
  const [editingNoteValue, setEditingNoteValue] = useState("");

  const myPicks = picks.filter((p) => p.user === ME.id);
  const othersPicks = picks.filter((p) => p.user !== ME.id);
  const myRadars = radarPicks.filter((r) => r.user === ME.id);
  const myTailFade = tailFadePicks.length ? tailFadePicks[0] : null;
  const isMatchingTailFade = !!(side && myTailFade && myTailFade.market === market && myTailFade.pick === side.label);

  const lockedCounts = {};
  picks.forEach((p) => { lockedCounts[p.pick] = (lockedCounts[p.pick] || 0) + 1; });
  const tailCounts = {};
  const fadeCounts = {};
  tailFadePicks.forEach((t) => {
    const bucket = t.type === "fade" ? fadeCounts : tailCounts;
    bucket[t.pick] = (bucket[t.pick] || 0) + 1;
  });
  const radarCounts = {};
  radarPicks.forEach((r) => { radarCounts[r.pick] = (radarCounts[r.pick] || 0) + 1; });
  const sides = Array.from(new Set([
    ...Object.keys(lockedCounts), ...Object.keys(tailCounts), ...Object.keys(fadeCounts), ...Object.keys(radarCounts),
  ]));
  const grandTotal = picks.length + radarPicks.length + tailFadePicks.length;

  function openForm() {
    setMarket("Spread"); setSide(null);
    setStake(1); setNote("");
    setFormOpen(true);
  }
  function openFormFromRadar(radar) {
    setMarket(radar.market);
    setSide({ label: radar.pick, odds: radar.odds });
    setStake(radar.stake);
    setNote(radar.note || "");
    setFormOpen(true);
  }
  function onCancelRadarClick(radar) {
    onRemoveRadar(radar.market, radar.pick);
  }
  function lockPick() {
    if (!side) return;
    onAddPick({ market, pick: side.label, odds: side.odds, stake, note });
    setFormOpen(false);
  }
  function radarPick() {
    if (!side) return;
    onAddRadar({ market, pick: side.label, odds: side.odds, stake, note });
    setFormOpen(false);
  }
  function startEditNote(pick) {
    setEditingNoteId(pick.id);
    setEditingNoteValue(pick.note || "");
  }
  function saveEditNote() {
    onEditNote(editingNoteId, editingNoteValue);
    setEditingNoteId(null);
  }

  return (
    <div style={{
      background: COLORS.surface2, borderRadius: 10, overflow: "hidden",
      border: "1px solid " + (grandTotal > 0 ? COLORS.gold : COLORS.line),
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 14px", borderBottom: "1px dashed " + COLORS.line }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: COLORS.muted }}>{game.conf}</span>
          {myRadars.length > 0 && <RadarIcon size={13} color={COLORS.gold} />}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 5, color: COLORS.muted }}>
          <ClockIcon size={13} />
          <span style={{ fontFamily: FONT_MONO, fontSize: 12 }}>{game.kickoff}</span>
        </div>
      </div>

      <div style={{ padding: "14px 14px 4px" }}>
        <div style={{ fontFamily: FONT_DISPLAY, fontSize: 19, fontWeight: 700, color: COLORS.paper }}>
          {game.away} <span style={{ color: COLORS.muted, fontWeight: 500 }}>at</span> {game.home}
        </div>
        <div style={{ fontFamily: FONT_MONO, fontSize: 12.5, color: COLORS.muted, marginTop: 2 }}>{lineSummary(game)}</div>
      </div>

      {grandTotal > 0 && (
        <div style={{ padding: "10px 14px 0" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", fontFamily: FONT_MONO, fontSize: 10.5, color: COLORS.muted, letterSpacing: 0.8, marginBottom: 6 }}>
            <span>{grandTotal} PICK{grandTotal !== 1 ? "S" : ""} LOGGED</span>
            <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ width: 7, height: 7, borderRadius: 2, background: COLORS.green, display: "inline-block" }} /> locked/tail
            </span>
            <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ width: 7, height: 7, borderRadius: 2, background: COLORS.blue, display: "inline-block" }} /> fade
            </span>
            <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ width: 7, height: 7, borderRadius: 2, background: "rgba(217,164,65,0.45)", display: "inline-block" }} /> radar
            </span>
          </div>
          {sides.map((s) => {
            const lockedCount = lockedCounts[s] || 0;
            const tailCount = tailCounts[s] || 0;
            const fadeCount = fadeCounts[s] || 0;
            const radarCount = radarCounts[s] || 0;
            const sideTotal = lockedCount + tailCount + fadeCount + radarCount;
            return (
              <div key={s} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 5 }}>
                <div style={{ fontSize: 12.5, width: 145, flexShrink: 0 }}>{s}</div>
                <div style={{ flex: 1, background: COLORS.surface3, borderRadius: 4, height: 7, overflow: "hidden", display: "flex" }}>
                  <div style={{ width: ((lockedCount + tailCount) / grandTotal) * 100 + "%", background: COLORS.green, height: "100%" }} />
                  <div style={{ width: (fadeCount / grandTotal) * 100 + "%", background: COLORS.blue, height: "100%" }} />
                  <div style={{ width: (radarCount / grandTotal) * 100 + "%", background: "rgba(217,164,65,0.45)", height: "100%" }} />
                </div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: COLORS.muted, width: 16, textAlign: "right" }}>{sideTotal}</div>
              </div>
            );
          })}
        </div>
      )}

      {othersPicks.length > 0 && (
        <div style={{ padding: "8px 14px 4px" }}>
          {othersPicks.map((p) => {
            const u = getUser(p.user);
            return (
              <button key={p.id} onClick={() => onOpenOverlay(p, game)} style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "7px 4px", background: "none", border: "none", cursor: "pointer", textAlign: "left", borderRadius: 6 }}>
                <Avatar user={u} size={22} />
                <div style={{ flex: 1, minWidth: 0, fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontWeight: 600 }}>{u.name}</span>
                  <span style={{ color: COLORS.muted }}>&middot; {p.market}</span>
                  {p.note && <MessageIcon size={13} color={COLORS.gold} />}
                </div>
                <div style={{ fontFamily: FONT_MONO, textAlign: "right", fontSize: 12.5 }}>
                  <div style={{ color: COLORS.paper }}>{p.pick}</div>
                  <div style={{ color: COLORS.muted }}>{signed(p.odds)} &middot; {p.stake}u</div>
                </div>
              </button>
            );
          })}
        </div>
      )}

      <div style={{ padding: 14, borderTop: "1px solid " + COLORS.line, marginTop: 4 }}>
        {(myPicks.length > 0 || myTailFade || myRadars.length > 0) && (
          <div style={{ display: "grid", gap: 8, marginBottom: 10 }}>
            {myPicks.map((p) => (
              <div key={p.id} style={{ display: "flex", alignItems: "flex-start", gap: 8, fontSize: 13, background: "rgba(76,154,106,0.12)", border: "1px solid rgba(76,154,106,0.4)", borderRadius: 8, padding: "9px 12px" }}>
                <CheckIcon size={15} color={COLORS.green} />
                <div style={{ minWidth: 0, flex: 1 }}>
                  <span>Your pick: <strong>{p.pick}</strong> &middot; {signed(p.odds)} &middot; {p.stake}u</span>
                  <SafeRender fallback={<div style={{ fontSize: 12, color: COLORS.muted, marginTop: 3 }}>{p.note || ""}</div>}>
                  {editingNoteId === p.id ? (
                    <div style={{ marginTop: 6 }}>
                      <textarea
                        value={editingNoteValue}
                        onChange={(e) => setEditingNoteValue(e.target.value.slice(0, NOTE_MAX))}
                        maxLength={NOTE_MAX}
                        rows={2}
                        autoFocus
                        style={{
                          width: "100%", background: COLORS.surface3, color: COLORS.paper, border: "1px solid " + COLORS.line,
                          borderRadius: 6, padding: "6px 8px", fontSize: 12.5, boxSizing: "border-box", resize: "vertical", fontFamily: FONT_BODY,
                        }}
                      />
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 4 }}>
                        <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: COLORS.muted }}>{editingNoteValue.length}/{NOTE_MAX}</span>
                        <div style={{ display: "flex", gap: 10 }}>
                          <button onClick={() => setEditingNoteId(null)} style={{ background: "none", border: "none", color: COLORS.muted, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Cancel</button>
                          <button onClick={saveEditNote} style={{ background: "none", border: "none", color: COLORS.gold, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Save</button>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8, marginTop: 3 }}>
                      {p.note ? (
                        <div style={{ fontSize: 12, color: COLORS.muted }}>{p.note}</div>
                      ) : <div />}
                      <button onClick={() => startEditNote(p)} style={{ display: "flex", alignItems: "center", gap: 3, background: "none", border: "none", color: COLORS.muted, fontSize: 11.5, fontWeight: 600, cursor: "pointer", flexShrink: 0, whiteSpace: "nowrap" }}>
                        <PencilIcon size={11} /> {p.note ? "Edit" : "Add comment"}
                      </button>
                    </div>
                  )}
                  </SafeRender>
                </div>
              </div>
            ))}

            {myTailFade && (() => {
              const srcUser = getUser(myTailFade.sourceUser);
              const isFade = myTailFade.type === "fade";
              return (
                <div style={{
                  display: "flex", alignItems: "center", gap: 8, fontSize: 13,
                  background: isFade ? "rgba(62,124,214,0.12)" : "rgba(76,154,106,0.12)",
                  border: "1px solid " + (isFade ? "rgba(62,124,214,0.4)" : "rgba(76,154,106,0.4)"),
                  borderRadius: 8, padding: "9px 12px",
                }}>
                  {isFade ? <ShuffleIcon size={15} color={COLORS.blue} /> : <CopyIcon size={15} color={COLORS.green} />}
                  <span>
                    {isFade ? "Fading" : "Tailing"} <strong>{srcUser ? srcUser.name : "a friend"}</strong>: <strong>{myTailFade.pick}</strong> &middot; {signed(myTailFade.odds)} &middot; {myTailFade.stake}u
                  </span>
                </div>
              );
            })()}

            {myRadars.map((r) => (
              <div key={r.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "rgba(217,164,65,0.12)", border: "1px solid rgba(217,164,65,0.4)", borderRadius: 8, padding: "9px 12px", gap: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, minWidth: 0 }}>
                  <RadarIcon size={15} color={COLORS.gold} />
                  <span>On your radar: <strong>{r.pick}</strong> &middot; {signed(r.odds)} &middot; {r.stake}u</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
                  <button onClick={() => openFormFromRadar(r)} style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", color: COLORS.gold, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                    <LockIcon size={13} /> Lock
                  </button>
                  <button onClick={() => onCancelRadarClick(r)} style={{ background: "none", border: "none", color: COLORS.muted, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                    Cancel
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}

        {!formOpen && (

              <button onClick={radarPick} disabled={!side} style={{

      </div>
    </div>
  );

function SheetTab({ feed, tailsFades, radar, dbGraded, onGrade }) {
  const myPicks = feed.filter((p) => p.user === ME.id && !p.result);
  const [historySearch, setHistorySearch] = useState("");
  const term = historySearch.trim().toLowerCase();
  const allHistory = useMemo(
    () => dbGraded.filter((r) => r.user === ME.id).sort((a, b) => a.daysAgo - b.daysAgo),
    [dbGraded]
  );
  const history = useMemo(() => {
    const filtered = term
      ? allHistory.filter((r) => (r.teamA || "").toLowerCase().includes(term) || (r.teamB || "").toLowerCase().includes(term))
      : allHistory;
    return filtered.slice(0, 12);
  }, [allHistory, term]);
  return (
    <div>
      <SectionLabel eyebrow="YOUR BOARD" title="My sheet" />
      <ChartBlock title="Your picks" subtitle="Still pending — settled picks move down to History once graded">
        {myPicks.length === 0 && <EmptyRow text="No pending picks. Head to the Slate to add one, or check History for settled ones." />}
        {myPicks.map((p) => <SheetRow key={p.id} pick={p} tag={null} onGrade={(result) => onGrade("picks", p.id, result)} />)}
      </ChartBlock>
      <ChartBlock title="Tails &amp; fades" subtitle="Copied from a friend's pick — graded in a separate win %, kept apart from your own picks">
        {tailsFades.length === 0 && <EmptyRow text="Tail or fade a friend's pick from the Slate to see it here." />}
        {tailsFades.map((p) => <SheetRow key={p.id} pick={p} tag={p.type} onGrade={(result) => onGrade("tails_fades", p.id, result)} />)}
      </ChartBlock>
      <ChartBlock title="Radar" subtitle="Still looking into these — not locked in, doesn't count toward any record yet">
        {radar.length === 0 && <EmptyRow text="Add a pick to your radar from the Slate to see it here." />}
        {radar.map((r) => <SheetRow key={r.id} pick={r} tag="radar" />)}
      </ChartBlock>
      <ChartBlock title="History" subtitle="Settled picks — auto-graded once a game finishes, or gradeable by hand a day after kickoff">
        <SearchBox value={historySearch} onChange={setHistorySearch} placeholder="Search by team" />
        {history.length === 0 && <EmptyRow text={term ? "No settled picks match \u201c" + historySearch + "\u201d." : "Nothing graded yet."} />}
        {history.map((r) => <HistoryRow key={r.id} row={r} onEditResult={r.resultSource === "manual" ? (result) => onGrade(r.source === "own" ? "picks" : "tails_fades", r.id, result) : null} />)}
      </ChartBlock>
    </div>
  );
}

function EmptyRow({ text }) {
  return <div style={{ fontSize: 13, color: COLORS.muted, padding: "10px 2px" }}>{text}</div>;
}

function SheetRow({ pick, tag, onGrade }) {
  const game = GAMES.find((g) => g.id === pick.game);
  const matchup = pick.gameLabel || (game ? game.away + " @ " + game.home : "Matchup unavailable");
  const gradeable = tag !== "radar" && onGrade && canManuallyGrade(pick);
  return (
    <div style={{ padding: "10px 2px", borderBottom: "1px solid " + COLORS.line }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        {tag && (
          <span style={{ fontFamily: FONT_MONO, fontSize: 10.5, fontWeight: 700, borderRadius: 5, padding: "2px 7px", flexShrink: 0, color: tag === "tail" ? COLORS.green : tag === "fade" ? COLORS.red : COLORS.gold, background: tag === "tail" ? "rgba(76,154,106,0.14)" : tag === "fade" ? "rgba(194,75,63,0.14)" : "rgba(217,164,65,0.14)" }}>
            {tag.toUpperCase()}
          </span>
        )}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13, fontWeight: 600 }}>{matchup}</div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: COLORS.muted }}>{pick.market}</div>
        </div>
        <div style={{ fontFamily: FONT_MONO, textAlign: "right", fontSize: 12.5 }}>
          <div style={{ color: COLORS.paper }}>{pick.pick}</div>

          <button onClick={() => onGrade("loss")} style={{ background: "rgba(194,75,63,0.14)", color: COLORS.red, border: "1px solid rgba(194,75,63,0.4)", borderRadius: 6, padding: "3px 10px", fontSize: 11.5, fontWeight: 700, cursor: "pointer" }}>Loss</button>

        </div>
      )}
    </div>
  );
}

function historyPickLabel(row) {
  if (row.market === "Total") return row.overUnder + " (total)";
  return row.pickedTeam + (row.market === "Spread" ? " (spread)" : " (ML)");
}

function WhosHotTab({ dbGraded, dbRoster }) {
  const byUser = {};
  dbGraded.forEach((r) => {
    if (!byUser[r.user]) byUser[r.user] = [];
    byUser[r.user].push(r);
  });
  const roster = dbRoster && dbRoster.length ? dbRoster : Object.keys(byUser);

  const onFire = [], heating = [], iceCold = [];
  roster.forEach((id) => {
    const rows = byUser[id] || [];
    const status = classifyHotStatus(rows);
    if (!status) return;
    const last10 = rows.slice().sort((a, b) => a.daysAgo - b.daysAgo).slice(0, 10);
    const entry = { id, user: getUser(id), rows: last10 };
    if (status === "fire") onFire.push(entry);
    else if (status === "ice") iceCold.push(entry);
    else if (status === "heating") heating.push(entry);
  });

  return (
    <div>
      <SectionLabel eyebrow="THE BOARD" title="Who's hot?" />

      <ChartBlock title="On Fire">
        {onFire.length === 0 && <EmptyRow text="Nobody's on a heater right now." />}
        {onFire.map((e) => <HotUserGroup key={e.id} entry={e} />)}
      </ChartBlock>

      <ChartBlock title="Heeeee's Heating Up">
        {heating.length === 0 && <EmptyRow text="Nobody's heating up right now." />}
        {heating.map((e) => <HotUserGroup key={e.id} entry={e} />)}
      </ChartBlock>

      <ChartBlock title="Ice Cold">
        {iceCold.length === 0 && <EmptyRow text="Nobody's ice cold right now." />}
        {iceCold.map((e) => <HotUserGroup key={e.id} entry={e} />)}
      </ChartBlock>
    </div>
  );
}

function HotUserGroup({ entry }) {

function AnalyticsTab({ analyticsUser, setAnalyticsUser, dbGraded, dbRoster }) {
  const rows = useMemo(() => dbGraded.filter((r) => r.user === analyticsUser), [dbGraded, analyticsUser]);
  const ownRows = useMemo(() => rows.filter((r) => r.source === "own"), [rows]);
  const tfRows = useMemo(() => rows.filter((r) => r.source !== "own"), [rows]);

  const bySport = useMemo(() => {
    const g = groupBy(rows, "sport");
    return Object.keys(g).map((k) => ({ name: k, ...aggregate(g[k]) }));
  }, [rows]);
  const byConf = useMemo(() => {
    const g = groupBy(rows, "conf");
    return Object.keys(g)
      .map((k) => ({ name: k, sport: g[k][0] ? g[k][0].sport : null, ...aggregate(g[k]) }))
      .sort((a, b) => b.units - a.units);
  }, [rows]);
  const byConfNFL = byConf.filter((c) => c.sport === "NFL");
  const byConfNCAAFB = byConf.filter((c) => c.sport === "NCAAFB");
  const byConfEPL = byConf.filter((c) => c.sport === "EPL");
  const byConfSerieA = byConf.filter((c) => c.sport === "SERIEA");
  const byConfBundesliga = byConf.filter((c) => c.sport === "BUNDESLIGA");
  const byTeam = useMemo(() => teamStats(rows), [rows]);
  const byMarket = useMemo(() => {
    const g = groupBy(rows, "market");
    return Object.keys(g).map((k) => ({ name: k, ...aggregate(g[k]) }));
  }, [rows]);
  const trend = useMemo(() => {
    const sorted = [...rows].sort((a, b) => b.daysAgo - a.daysAgo); // oldest first
    let cum = 0;
    return sorted.map((r) => {
      cum += payoutUnits(r.stake, r.result);
      return { label: r.dateLabel || "\u2014", value: Math.round(cum * 10) / 10 };
    });
  }, [rows]);

  const overall = aggregate(rows);
  const own = aggregate(ownRows);
  const tf = aggregate(tfRows);
  const last7 = aggregate(rows.filter((r) => r.daysAgo <= 7));
  const last30 = aggregate(rows.filter((r) => r.daysAgo <= 30));
  const maxUnitAbs = Math.max(1, ...byMarket.map((m) => Math.abs(m.units)));
  const rosterUsers = (dbRoster && dbRoster.length ? dbRoster.map((id) => getUser(id)) : [ME]);
  const hasData = rows.length > 0;

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>

      </div>

      {!hasData && (
        <div style={{ background: COLORS.surface, border: "1px solid " + COLORS.line, borderRadius: 12, padding: 20, marginTop: 20, fontSize: 13, color: COLORS.muted, lineHeight: 1.6 }}>
          No graded picks yet for this user. Analytics fills in automatically once picks start getting settled &mdash; grading is coming soon.
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12, marginTop: 20 }}>
        <StatCard label="Record" value={overall.wins + "-" + overall.losses + "-" + overall.pushes} />
        <StatCard label="Win %" value={overall.winPct + "%"} />
        <StatCard label="Net units" value={(overall.units >= 0 ? "+" : "") + overall.units} tone={overall.units >= 0 ? "up" : "down"} />
      </div>

      <ChartBlock title="Win % over time" subtitle="Success rate across three windows">
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14 }}>
          <TimeWindowStat label="LAST 7 DAYS" stat={last7} />
          <TimeWindowStat label="LAST 30 DAYS" stat={last30} />
          <TimeWindowStat label="ALL TIME" stat={overall} />
        </div>
      </ChartBlock>

      <ChartBlock title="Own picks vs. tails &amp; fades" subtitle="Kept as two separate records, same as on My Sheet">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          <div style={{ background: COLORS.surface2, borderRadius: 10, padding: 14 }}>
            <div style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: COLORS.muted, marginBottom: 8 }}>OWN PICKS &middot; N={own.n}</div>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <div>
                <div style={{ fontFamily: FONT_DISPLAY, fontSize: 22, fontWeight: 700 }}>{own.winPct}%</div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.muted }}>win rate</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontFamily: FONT_DISPLAY, fontSize: 22, fontWeight: 700, color: own.units >= 0 ? COLORS.green : COLORS.red }}>{own.units >= 0 ? "+" : ""}{own.units}</div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.muted }}>units</div>
              </div>
            </div>
          </div>
          <div style={{ background: COLORS.surface2, borderRadius: 10, padding: 14 }}>
            <div style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: COLORS.muted, marginBottom: 8 }}>TAILS &amp; FADES &middot; N={tf.n}</div>

                <div style={{ fontFamily: FONT_DISPLAY, fontSize: 22, fontWeight: 700 }}>{tf.winPct}%</div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.muted }}>win rate</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontFamily: FONT_DISPLAY, fontSize: 22, fontWeight: 700, color: tf.units >= 0 ? COLORS.green : COLORS.red }}>{tf.units >= 0 ? "+" : ""}{tf.units}</div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.muted }}>units</div>
              </div>
            </div>
          </div>
        </div>
      </ChartBlock>

      <ChartBlock title="This user's units over time">
        <MiniLineChart data={trend} height={200} />
      </ChartBlock>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 20, marginTop: 20 }}>
        <ChartBlock title="Win % by sport">
          <HBarList
            rows={bySport.map((s) => ({ label: s.name, value: s.winPct, display: s.winPct + "%", color: COLORS.gold, max: 100 }))}
          />
        </ChartBlock>
        <ChartBlock title="Net units by bet type">
          <HBarList
            rows={byMarket.map((m) => ({ label: m.name, value: Math.abs(m.units), display: (m.units >= 0 ? "+" : "") + m.units, color: m.units >= 0 ? COLORS.green : COLORS.red, max: maxUnitAbs }))}
          />
        </ChartBlock>
      </div>

      <ChartBlock title="By conference" subtitle="Smallest samples first — check the count before you trust the trend">
        <ConfStatsTable label="NFL" rows={byConfNFL} />
        <ConfStatsTable label="NCAAFB" rows={byConfNCAAFB} />
        <ConfStatsTable label="EPL" rows={byConfEPL} />
        <ConfStatsTable label="Serie A" rows={byConfSerieA} />
        <ConfStatsTable label="Bundesliga" rows={byConfBundesliga} />
      </ChartBlock>

      <ChartBlock title="By team" subtitle="Win % betting for, against, on overs and unders for each team you've picked">

        <TeamStatsTable label="NCAAFB" teams={byTeam.filter((t) => t.sport === "NCAAFB")} />
        <TeamStatsTable label="EPL" teams={byTeam.filter((t) => t.sport === "EPL")} />
        <TeamStatsTable label="Serie A" teams={byTeam.filter((t) => t.sport === "SERIEA")} />
        <TeamStatsTable label="Bundesliga" teams={byTeam.filter((t) => t.sport === "BUNDESLIGA")} />
        <div style={{ fontSize: 11, color: COLORS.muted, marginTop: 4 }}>
          &ldquo;For&rdquo; and &ldquo;against&rdquo; cover spread and moneyline picks on that team; &ldquo;over&rdquo; and &ldquo;under&rdquo; cover total bets on their games; &ldquo;combined&rdquo; is every graded pick touching that team. &mdash; is shown where there's no decided pick yet.
        </div>
      </ChartBlock>
    </div>
  );
}

/* simple SVG line chart — no chart library required */
function MiniLineChart({ data, height }) {
  if (!data.length) return <div style={{ fontSize: 13, color: COLORS.muted }}>Not enough graded picks yet.</div>;
  const W = 600, H = height || 200, PAD = 24;
  const values = data.map((d) => d.value);
  const minV = Math.min(0, ...values);
  const maxV = Math.max(0, ...values, 1);
  const range = (maxV - minV) || 1;
  const points = data.map((d, i) => {
    const x = data.length > 1 ? PAD + (i / (data.length - 1)) * (W - 2 * PAD) : W / 2;
    const y = H - PAD - ((d.value - minV) / range) * (H - 2 * PAD);
    return { x, y, label: d.label, value: d.value };
  });
  const zeroY = H - PAD - ((0 - minV) / range) * (H - 2 * PAD);
  const polyPoints = points.map((p) => p.x + "," + p.y).join(" ");

  return (
    <div>
      <svg viewBox={"0 0 " + W + " " + H} width="100%" height={H} style={{ display: "block" }}>
        <line x1={PAD} y1={zeroY} x2={W - PAD} y2={zeroY} stroke={COLORS.line} strokeWidth="1" strokeDasharray="4 4" />
        <polyline points={polyPoints} fill="none" stroke={COLORS.gold} strokeWidth="2.5" />
        {points.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="3.5" fill={COLORS.gold} />)}
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
        {points.map((p, i) => (
          <span key={i} style={{ fontFamily: FONT_MONO, fontSize: 10, color: COLORS.muted }}>{p.label}</span>
        ))}
      </div>
    </div>
  );
}

function ChartBlock({ title, subtitle, children }) {
  return (
    <div style={{ background: COLORS.surface, border: "1px solid " + COLORS.line, borderRadius: 12, padding: "16px 18px", marginTop: 20 }}>
      <div style={{ marginBottom: 8 }}>
        <div style={{ fontSize: 14.5, fontWeight: 600, color: COLORS.paper }}>{title}</div>
        {subtitle && <div style={{ fontSize: 12, color: COLORS.muted, marginTop: 2 }}>{subtitle}</div>}
      </div>
      {children}
    </div>
  );
}

// A small, silent error boundary for isolating one risky bit of UI (like a
// single pick's comment editor) so a problem there can't blank the whole
// page — it just quietly falls back instead.
class SafeRender extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("SafeRender caught:", error, info);
  }
  render() {
    if (this.state.error) {
      const msg = this.state.error && this.state.error.message ? this.state.error.message : String(this.state.error);
      return (
        <div style={{ background: COLORS.surface2, borderRadius: 10, border: "1px solid " + COLORS.red, padding: 14, fontSize: 12.5 }}>
          <div style={{ fontWeight: 700, color: COLORS.red, marginBottom: 6 }}>{this.props.label || "This card"} hit an error:</div>
          <pre style={{ whiteSpace: "pre-wrap", fontFamily: FONT_MONO, fontSize: 11, color: COLORS.muted, margin: 0, wordBreak: "break-word" }}>{msg}</pre>
        </div>
      );
    }
    return this.props.children;
  }
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Slate crashed:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ background: "#0E1811", minHeight: "100vh", color: "#ECE7D9", padding: 24, fontFamily: "monospace", fontSize: 13, lineHeight: 1.6 }}>
          <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 12, color: "#C24B3F" }}>Something broke.</div>
          <div style={{ marginBottom: 16 }}>Screenshot this and send it back — this is the actual error instead of a blank screen:</div>
          <pre style={{ whiteSpace: "pre-wrap", background: "#16241C", padding: 14, borderRadius: 8, border: "1px solid rgba(255,255,255,0.09)" }}>
            {String(this.state.error && this.state.error.stack ? this.state.error.stack : this.state.error)}
          </pre>
          <button
            onClick={() => window.location.reload()}
            style={{ marginTop: 16, background: "#D9A441", color: "#1A1305", border: "none", borderRadius: 8, padding: "10px 16px", fontWeight: 700, cursor: "pointer" }}
          >
            Reload
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>
